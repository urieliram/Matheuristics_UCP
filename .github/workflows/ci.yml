name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        # CPLEX is deliberately left out: the full solver needs a licence that CI does not have.
        # Everything gated behind the `slow` marker is skipped below for the same reason.
        run: |
          python -m pip install --upgrade pip
          pip install pyomo numpy pandas matplotlib pytest

      - name: Byte-compile every module
        run: python -m compileall -q main.py uc_Co.py reading.py solution.py util.py routines.py Extract.py

      - name: Run the tests that do not need a solver
        run: pytest -m "not slow" -q

      - name: Check that config.con is versioned
        # A clone without config.con cannot run main.py at all, so guard it.
        run: test -f config.con

      - name: Check that no build artefacts or secrets are tracked
        run: |
          ! git ls-files | grep -E '\.pyc$' || { echo "::error::__pycache__ artefacts are tracked"; exit 1; }
          ! git grep -qE 'ghp_[A-Za-z0-9]{36}' -- . || { echo "::error::a GitHub token is committed"; exit 1; }
